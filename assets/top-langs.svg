<svg width="350" height="160" viewBox="0 0 350 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="titleId" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="titleId">Most Used Languages</title>

  <style>
    .header { font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif; fill: #fe428e; }
    .lang   { font: 400 13px 'Segoe UI', Ubuntu, "Helvetica Neue", Sans-Serif; fill: #a9fef7; }
  </style>

  <!-- Borda do card. Para tirar: troque stroke-opacity para 0 -->
  <rect x="0.5" y="0.5" rx="4.5" width="349" height="159" fill="#141321" stroke="#e4e2e2" stroke-opacity="1"/>

  <text x="25" y="33" class="header">Most Used Languages</text>

  <!-- Barra segmentada (cantos arredondados via clip) -->
  <defs>
    <clipPath id="barClip"><rect x="25" y="48" width="300" height="10" rx="5"/></clipPath>
  </defs>
  <g clip-path="url(#barClip)">
    <rect x="25.00" y="48" width="102.00" height="10" fill="#3178c6"/>
    <rect x="127.00" y="48" width="78.00" height="10" fill="#f1e05a"/>
    <rect x="205.00" y="48" width="48.00" height="10" fill="#3572A5"/>
    <rect x="253.00" y="48" width="36.00" height="10" fill="#e34c26"/>
    <rect x="289.00" y="48" width="24.00" height="10" fill="#563d7c"/>
    <rect x="313.00" y="48" width="12.00" height="10" fill="#b07219"/>
  </g>

  <!-- Lista de linguagens (2 colunas). Para editar um %:
       mude o numero no <text> E a largura (width) do segmento correspondente na barra. -->
  <circle cx="30" cy="81" r="5" fill="#3178c6"/>
  <text x="43" y="85" class="lang">TypeScript 34.00%</text>
  <circle cx="190" cy="81" r="5" fill="#f1e05a"/>
  <text x="203" y="85" class="lang">JavaScript 26.00%</text>
  <circle cx="30" cy="108" r="5" fill="#3572A5"/>
  <text x="43" y="112" class="lang">Python 16.00%</text>
  <circle cx="190" cy="108" r="5" fill="#e34c26"/>
  <text x="203" y="112" class="lang">HTML 12.00%</text>
  <circle cx="30" cy="135" r="5" fill="#563d7c"/>
  <text x="43" y="139" class="lang">CSS 8.00%</text>
  <circle cx="190" cy="135" r="5" fill="#b07219"/>
  <text x="203" y="139" class="lang">Java 4.00%</text>
</svg>

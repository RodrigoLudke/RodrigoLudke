<svg width="495" height="195" viewBox="0 0 495 195" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="titleId" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="titleId">GitHub Streak Stats</title>

  <style>
    .num  { font: 700 28px 'Segoe UI', Ubuntu, Sans-Serif; }
    .lbl  { font: 600 14px 'Segoe UI', Ubuntu, Sans-Serif; fill: #a9fef7; }
    .date { font: 400 12px 'Segoe UI', Ubuntu, Sans-Serif; fill: #8b98c9; }
  </style>

  <!-- Borda do card (igual aos outros). Para tirar: stroke-opacity=0 -->
  <rect x="0.5" y="0.5" rx="4.5" width="494" height="194" fill="#141321" stroke="#e4e2e2" stroke-opacity="1"/>

  <!-- Divisorias -->
  <line x1="165" y1="28" x2="165" y2="167" stroke="#8b98c9" stroke-opacity="0.35"/>
  <line x1="330" y1="28" x2="330" y2="167" stroke="#8b98c9" stroke-opacity="0.35"/>

  <!-- ===== COLUNA 1: Total Contributions ===== -->
  <text x="82" y="70"  class="num"  fill="#fe428e" text-anchor="middle">573</text>
  <text x="82" y="100" class="lbl"  text-anchor="middle">Total Contributions</text>
  <text x="82" y="122" class="date" text-anchor="middle">Jan 1, 2023 - Present</text>

  <!-- ===== COLUNA 2: Current Streak (anel + chama) ===== -->
  <circle cx="247" cy="72" r="40" fill="none" stroke="#fe428e" stroke-width="5"/>
  <!-- notch no topo do anel pra chama encaixar -->
  <circle cx="247" cy="32" r="13" fill="#141321"/>
  <g transform="translate(235, 20) scale(1.0)">
    <path d="M12 1 C13 5 16 6 16 10.5 C16 14 13.5 16.5 12 16.5 C10.5 16.5 8 14 8 10.5 C8 8 9.5 7 10 5 C10.5 6.5 11.5 7 12 6 C12 4 11 2.5 12 1 Z" fill="#a9fef7"/>
  </g>
  <text x="247" y="82"  class="num" fill="#a9fef7" text-anchor="middle">4</text>
  <text x="247" y="140" class="lbl" fill="#fe428e" text-anchor="middle">Current Streak</text>
  <text x="247" y="162" class="date" text-anchor="middle">Sep 1 - Sep 4</text>

  <!-- ===== COLUNA 3: Longest Streak ===== -->
  <text x="412" y="70"  class="num"  fill="#fe428e" text-anchor="middle">18</text>
  <text x="412" y="100" class="lbl"  text-anchor="middle">Longest Streak</text>
  <text x="412" y="122" class="date" text-anchor="middle">May 3 - May 20, 2024</text>
</svg>
